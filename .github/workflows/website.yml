# Build the MkDocs course website and deploy it to GitHub Pages.
#
# How to enable (one-time, in the repo):
#   Settings → Pages → Source: "GitHub Actions"
# Then push to `main` (or run this workflow manually via Actions → Run workflow).
#
# The student-facing site is built from the repository root (see mkdocs.yml,
# docs_dir: .). Instructor-only files are excluded in mkdocs.yml
# (exclude_docs) — keep that list in sync with what you publish.

name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install website build requirements
        run: pip install -r website-requirements.txt

      - name: Populate docs/ from the repository content
        run: python scripts/build_site_src.py

      - name: Build the site with MkDocs
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
