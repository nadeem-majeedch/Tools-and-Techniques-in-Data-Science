# Validate the student-facing course notebooks on every push and PR.
#
# What this does:
#   - Executes every notebook in course-notebooks/ with a real Python kernel.
#   - Fails CI if ANY cell raises an unhandled error.
#   - Does NOT modify the .ipynb files (scripts/check_notebooks.py executes
#     them in memory and discards the outputs).
#
# Optional services:
#   - Ollama (notebooks 14-18) is intentionally NOT installed. Those notebooks
#     wrap every model call in try/except and degrade gracefully — they teach
#     the full workflow with mock/simulation paths that always run.
#   - No paid APIs, no API keys, no model downloads. The only network use is
#     keyless public APIs (Open-Meteo, JSONPlaceholder) in notebooks 09/19,
#     and cached cells keep re-runs offline-friendly.
#
# Local equivalent (before pushing):
#   python -m pip install -r requirements.txt
#   python -m pip install nbclient nbformat
#   python scripts/check_notebooks.py          # no notebooks are modified

name: Notebooks CI

on:
  push:
    branches: [main]
    paths:
      - "course-notebooks/**"
      - "scripts/notebook_src/**"
      - "scripts/check_notebooks.py"
      - "scripts/build_course_notebooks.py"
      - "requirements.txt"
      - ".github/workflows/notebooks.yml"
  pull_request:
    branches: [main]
    paths:
      - "course-notebooks/**"
      - "scripts/notebook_src/**"
      - "scripts/check_notebooks.py"
      - "scripts/build_course_notebooks.py"
      - "requirements.txt"
      - ".github/workflows/notebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    name: Execute all course notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install course requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbclient nbformat

      - name: Validate notebooks (no .ipynb file is modified)
        run: python scripts/check_notebooks.py

      - name: Confirm no notebook files changed
        run: |
          if ! git diff --exit-code -- course-notebooks/; then
            echo "::error::Notebook files were modified during CI — check_notebooks.py must execute notebooks in memory only."
            exit 1
          fi
