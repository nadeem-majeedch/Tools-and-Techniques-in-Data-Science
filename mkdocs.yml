# ============================================================
# Course website configuration (MkDocs + Material theme)
# ------------------------------------------------------------
# The whole repository is the "docs" source: every Markdown file
# below the repo root becomes a page. The navigation tree below
# defines the site structure and the Previous | Next reading order.
#
# Local preview:
#   pip install -r website-requirements.txt
#   mkdocs serve          # then open http://127.0.0.1:8000
#
# Publishing:
#   Push to `main`; the GitHub Actions workflow
#   (.github/workflows/website.yml) builds and deploys this site.
#   Set your repo URL in the `site_url` placeholder below once known.
# ============================================================

site_name: Introduction to Data Science
site_description: >-
  BS Data Science (3rd semester) course site — Python, NumPy, Pandas,
  visualization, machine learning, Streamlit, and AI-assisted workflows.
# Set these once your repository exists:
# site_url: https://<your-org>.github.io/<your-repo>/
# repo_url: https://github.com/<your-org>/<your-repo>
# edit_uri: edit/main/

# Content lives at the repository root; docs/ is populated from it by
# `python scripts/build_site_src.py` (run it before serve/build — CI does
# this automatically in .github/workflows/website.yml).
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    logo: material/school
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections        # group top-level items as labelled sections
    - navigation.top              # back-to-top button
    - navigation.footer           # always show the Previous | Next footer
    - toc.follow                  # highlight the section currently in view
    - search.suggest
    - search.highlight
    - content.code.copy           # copy button on code blocks
    - content.code.annotate

extra:
  generator: false               # hide the "Made with Material" note
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.caret
  - pymdownx.details            # collapsible blocks: ??? note
  - pymdownx.highlight
  - pymdownx.mark
  - pymdownx.superfences        # fenced code blocks + syntax highlighting
  - pymdownx.tasklist
  - pymdownx.tilde

# ------------------------------------------------------------
# What NOT to publish. This is a student-facing site: graded
# assessments with answer keys and instructor solutions stay in
# the repository but are excluded from the website build.
# Add or remove paths here to change what is published.
# ------------------------------------------------------------
exclude_docs: |
  # Instructor-only material (safety net: scripts/build_site_src.py already
  # leaves these out of docs/, this also protects direct `mkdocs build` runs)
  quizzes/
  exams/
  labs/instructor-solutions/
  streamlit/labs/solutions/
  assignments/assignment-01-data-cleaning-eda/instructor-solution.md
  assignments/assignment-01-data-cleaning-eda/instructor-clean.csv
  assignments/assignment-02-api-streamlit-app/instructor-solution.md
  projects/final-project/viva-questions.md

